[build]
  base    = "."
  command = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/optilife build"
  publish = "artifacts/optilife/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"
  BASE_PATH    = "/"

# Proxy /api/* to your deployed API server (update URL after Railway deploy).
[[redirects]]
  from   = "/api/*"
  to     = "https://crm-hpcx.onrender.com/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# The service worker must never be served from cache, or a deploy can't reach
# clients that already have the old one registered.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type  = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
