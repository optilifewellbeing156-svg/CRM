[build]
  base    = "."
  command = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/optilife build"
  publish = "artifacts/optilife/dist/public"

[build.environment]
  NODE_VERSION  = "20"
  NODE_ENV      = "production"
  BASE_PATH     = "/"
  PNPM_VERSION  = "9"

# Proxy /api/* to your deployed API server (update URL after Railway deploy).
[[redirects]]
  from   = "/api/*"
  to     = "https://YOUR_API_SERVER_URL/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
