kind = "web"
previewPath = "/"
title = "OptiLife ERP"
version = "1.0.0"
id = "artifacts/optilife"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18924

[services.development]
run = "pnpm --filter @workspace/optilife run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/optilife", "run", "build" ]
publicDir = "artifacts/optilife/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18924"
BASE_PATH = "/"
